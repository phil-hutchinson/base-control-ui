    <!-- planet 1 simple planet with basic moon -->
    <svg width="60" height="60" viewBox="0 0 100 100">
      <defs>
        <!-- planet -->
        <radialGradient id="p1" cx="40%" cy="40%" r="70%">
          <stop offset="0%" stop-color="tan" stop-opacity="1" />
          <stop offset="100%" stop-color="cornflowerblue" stop-opacity="0.4" />
        </radialGradient>

        <!-- moon -->
        <radialGradient id="p1moon-sheen" cx="40%" cy="40%" r="70%">
          <stop offset="0%" stop-color="white" stop-opacity="0.55" />
          <stop offset="100%" stop-color="rebeccapurple" stop-opacity="0.1" />
        </radialGradient>
        <filter id="p1moon-blur">
          <feGaussianBlur stdDeviation="0.8" />
        </filter>
        <clipPath id="p1moon-clip">
          <circle cx="20" cy="53" r="13"></circle>
        </clipPath>
        <radialGradient id="p1moon-sheen" cx="40%" cy="40%" r="70%">
          <stop offset="0%" stop-color="white" stop-opacity="0.55" />
          <stop offset="100%" stop-color="rebeccapurple" stop-opacity="0.1" />
        </radialGradient>
      </defs>

      <!-- moon -->
      <g filter="url(#p1moon-blur)" clip-path="url(#p1moon-clip)">
        <circle cx="20" cy="53" r="15" fill="#E6E8BA" />
        <g transform="translate(19 62)">
          <circle cx="0" cy="0" r="4" fill="#B6A87A" stroke="#9A7909" />
        </g>
        <g transform="translate(13 49)">
          <circle cx="0" cy="0" r="3" fill="#B6A87A" stroke="#9A7909" />
        </g>
        <g transform="translate(23 45)">
          <circle cx="0" cy="0" r="3" fill="#B6A87A" stroke="#9A7909" />
        </g>
      </g>
      <circle cx="20" cy="53" r="13" fill="url(#p1moon-sheen)" />

      <!-- planet -->
      <circle cx="50" cy="50" r="28" fill="black" />
      <circle cx="50" cy="50" r="28" fill="url(#p1)" />
    </svg>

          <stop offset="0%" stop-color="white" stop-opacity="0.75"></stop>
          <stop offset="100%" stop-color="rebeccapurple" stop-opacity="0.1"></stop>
        </radialGradient>
        <filter id="p10blur">
          <feGaussianBlur stdDeviation="2.65" />
        </filter>
        <clipPath id="p10clip">
          <circle cx="50" cy="50" r="33"></circle>
        </clipPath>
      </defs>

      <g filter="url(#p10blur)" clip-path="url(#p10clip)">
        <circle cx="50" cy="50" r="35" fill="#DB25DB" />
        <line x1="20" y1="65" x2="55" y2="58" stroke="#f2d8f3" stroke-width="3" stroke-linecap="round" />
        <line x1="25" y1="71" x2="55" y2="65" stroke="#f2d8f3" stroke-width="3" stroke-linecap="round" />
        <circle cx="58" cy="63" r="6" stroke="#f2d8f3" stroke-width="2" fill-opacity="0" />
        <line x1="64" y1="60" x2="84" y2="56" stroke="#f2d8f3" stroke-width="5" stroke-linecap="round" />
      </g>
      <circle cx="50" cy="50" r="33" fill="url(#p10sheen)" />
    </svg>


    <!-- planet 11 Yellow Orange Green -->
    <svg width="60" height="60" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="p11" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#DDB32C" stop-opacity="1" />
          <stop offset="0.19" stop-color="#DDB32C" stop-opacity="1" />
          <stop offset="0.19" stop-color="#C9CE3B" stop-opacity="1" />
          <stop offset="0.28" stop-color="#EA9D1F" stop-opacity="1" />
          <stop offset="0.31" stop-color="#989425" stop-opacity="1" />
          <stop offset="0.35" stop-color="#B3BE4B" stop-opacity="1" />
          <stop offset="0.38" stop-color="#B3BE4B" stop-opacity="1" />
          <stop offset="0.44" stop-color="#F2BD2C" stop-opacity="1" />
          <stop offset="0.57" stop-color="#E0D429" stop-opacity="1" />
          <stop offset="0.69" stop-color="#E3B126" stop-opacity="1" />
          <stop offset="0.76" stop-color="#DB8821" stop-opacity="1" />
          <stop offset="0.79" stop-color="#C29029" stop-opacity="1" />
          <stop offset="0.86" stop-color="#B2D435" stop-opacity="1" />
          <stop offset="1" stop-color="#E5AB24" stop-opacity="1" />
        </linearGradient>
        <radialGradient id="p11sheen" cx="40%" cy="40%" r="70%">
          <stop offset="0%" stop-color="white" stop-opacity="0.55" />
          <stop offset="100%" stop-color="rebeccapurple" stop-opacity="0.1" />
        </radialGradient>
        <filter id="p11blur">
          <feGaussianBlur stdDeviation="1" />
        </filter>
        <clipPath id="p11clip">
          <circle cx="50" cy="50" r="34"></circle>
        </clipPath>
      </defs>

      <g transform="rotate(-7,50,50)" filter="url(#p11blur)" clip-path="url(#p11clip)">
        <circle cx="50" cy="50" r="34" fill="url(#p11)" />
        <circle cx="50" cy="50" r="34" fill="url(#p11sheen)" transform="rotate(7,50,50)" />
      </g>  
    </svg>


    <!-- planet 12 Crater Planet -->
    <svg width="60" height="60" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="p12sheen" cx="40%" cy="40%" r="70%">
          <stop offset="0%" stop-color="white" stop-opacity="0.55" />
          <stop offset="100%" stop-color="rebeccapurple" stop-opacity="0.1" />
        </radialGradient>
        <filter id="p12blur">
          <feGaussianBlur stdDeviation="2.1" />
        </filter>
        <clipPath id="p12clip">
          <circle cx="50" cy="50" r="32"></circle>
        </clipPath>
      </defs>

      <g filter="url(#p12blur)" clip-path="url(#p12clip)">
        <circle cx="50" cy="50" r="36" fill="#E6E8BA" />
        <g transform="translate(35 35) rotate(-45 0 0) scale(1.2 1)">
          <circle cx="0" cy="0" r="6" fill="#C9D69A" stroke="#9A7909" />
        </g>
        <g transform="translate(68 42) rotate(60 0 0) scale(1.1 1)">
          <circle cx="0" cy="0" r="9" fill="#C6C88A" stroke="#9A7909" />
        </g>
        <g transform="translate(41 43)">
          <circle cx="0" cy="0" r="6" fill="#B6A87A" stroke="#9A7909" />
        </g>
        <g transform="translate(51 25) scale(1.5 1)">
          <circle cx="0" cy="0" r="3" fill="#DFDACF" stroke="#999" />
        </g>
        <g transform="translate(31 61) rotate(135 0 0) scale(1 1.5)">
          <circle cx="0" cy="0" r="3" fill="#CECE9C" stroke="#AC9A0C" />
        </g>
        <g transform="translate(47 70) scale(1.3 1)">
          <circle cx="0" cy="0" r="6" fill="#C9D69A" stroke="#9A7909" />
        </g>
      </g>  
      <circle cx="50" cy="50" r="32" fill="url(#p12sheen)" />
    </svg>


    <!-- planet 13 Wavy Planet - 3 stacked wave bands, each sliding
         pink -> magenta -> bluey-purple from trough to crest -->
    <svg width="60" height="60" viewBox="0 0 100 100">
      <defs>
        <!-- one band's gradient: pink at the bottom, bluey-purple at the top;
             objectBoundingBox units so it re-fits each band -->
        <linearGradient id="p13wave1" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#16d9e9" />
          <stop offset="25%" stop-color="#2eaad1" />
          <stop offset="50%" stop-color="#4f84b0" />
          <stop offset="75%" stop-color="#874eb1" />
          <stop offset="100%" stop-color="#5300df" />
        </linearGradient>
        <linearGradient id="p13wave2" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#e1e0f6" />
          <stop offset="25%" stop-color="#bcc2e5" />
          <stop offset="50%" stop-color="#8eafd0" />
          <stop offset="75%" stop-color="#45a3ba" />
          <stop offset="100%" stop-color="#2db0d2" />
        </linearGradient>
        <linearGradient id="p13wave3" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#ececeb" />
          <stop offset="25%" stop-color="#cebbcb" />
          <stop offset="50%" stop-color="#b79bb2" />
          <stop offset="75%" stop-color="#c47ebb" />
          <stop offset="100%" stop-color="#b763ad" />
        </linearGradient>
        <radialGradient id="p13sheen" cx="40%" cy="40%" r="70%">
          <stop offset="0%" stop-color="white" stop-opacity="0.55" />
          <stop offset="100%" stop-color="rebeccapurple" stop-opacity="0.1" />
        </radialGradient>
        <filter id="p13blur">
          <feGaussianBlur stdDeviation="3.75" />
        </filter>
        <clipPath id="p13clip">
          <circle cx="50" cy="50" r="43" />
        </clipPath>
      </defs>

      <g filter="url(#p13blur)" clip-path="url(#p13clip)">
        <!-- band 1 (bottom) - edge B: ~2 lazy crests/troughs, uneven spacing + depth -->
        <path d="M-10,64 Q0,51 8,62 Q17,75 30,66 Q43,48 50,63 Q59,78 72,66 Q84,54 92,64 Q101,76 110,64
                 L110,96 L-10,96 Z" fill="url(#p13wave1)" />
        <!-- band 2 (middle) - top follows edge A (busy), bottom follows edge B (lazy) -->
        <path d="M-10,36 Q-2,27 4,34 Q11,45 16,38 Q21,26 30,35 Q39,43 44,37 Q50,30 58,34 Q67,47 72,38 Q79,29 90,36 Q100,44 110,36
                 L110,64 Q101,76 92,64 Q84,54 72,66 Q59,78 50,63 Q43,48 30,66 Q17,75 8,62 Q0,51 -10,64 Z"
          fill="url(#p13wave2)" />
        <!-- band 3 (top) - edge A: ~3 crests/troughs, jittered spacing + amplitude -->
        <path d="M-10,6 L110,6 L110,36
                 Q100,44 90,36 Q79,29 72,38 Q67,47 58,34 Q50,30 44,37 Q39,43 30,35 Q21,26 16,38 Q11,45 4,34 Q-2,27 -10,36 Z"
          fill="url(#p13wave3)" />
      </g>
      <circle cx="50" cy="50" r="43" fill="url(#p13sheen)" />
    </svg>

    <!-- planet 14 Ringed Planet - Planet, blue rings -->
    <svg width="60" height="60" viewBox="0 0 100 100">
      <defs>
        <!-- planet -->
        <radialGradient id="p14sheen" cx="40%" cy="40%" r="70%">
          <stop offset="0%" stop-color="white" stop-opacity="0.75" />
          <stop offset="100%" stop-color="rebeccapurple" stop-opacity="0.1" />
        </radialGradient>

        <!-- ring -->
        <radialGradient id="p14ring" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="48">
          <stop offset="0.45" stop-color="#5EB0E0" />
          <stop offset="0.60" stop-color="#59E3CE" />
          <stop offset="0.68" stop-color="#1A4996" />
          <stop offset="0.79" stop-color="#4A7499" />
          <stop offset="0.90" stop-color="#7DF0EA" />
          <stop offset="1" stop-color="#79E9ED" />
        </radialGradient>

        <!-- ring sheen centred on the 7 o'clock point -->
        <radialGradient id="p14ringsheen" gradientUnits="userSpaceOnUse" gradientTransform="scale(1,5)" cx="-17.5"
          cy="6.06" r="40">
          <stop offset="0%" stop-color="white" stop-opacity="0.55" />
          <stop offset="100%" stop-color="rebeccapurple" stop-opacity="0.1" />
        </radialGradient>

        <g id="p14ringWhole" transform="translate(50,50) scale(1,0.2)">
          <circle r="36" fill="none" stroke="url(#p14ring)" stroke-width="24" />
          <!--circle r="36" fill="none" stroke="url(#p14ringsheen)" stroke-width="24" /-->
        </g>

        <clipPath id="p14ringBack">
          <rect x="0" y="0" width="100" height="50" />
        </clipPath>
        <clipPath id="p14ringFront">
          <rect x="0" y="49.6" width="100" height="50.4" />
        </clipPath>
      </defs>

      <g transform="rotate(18, 50, 50)">
        <use href="#p14ringWhole" clip-path="url(#p14ringBack)" />
        <circle cx="50" cy="50" r="15" fill="#A1962F" />
        <circle cx="50" cy="50" r="15" fill="url(#p14sheen)" />
        <use href="#p14ringWhole" clip-path="url(#p14ringFront)" />
      </g>
    </svg>



  </div>
